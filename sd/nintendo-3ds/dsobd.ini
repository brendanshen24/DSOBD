# DSOBD Configuration File
# Place this file as 'dsobd.ini' in the root directory of your DS Flashcart (R4, DSTWO) or DSi SD Card.

# WiFi Network Name (SSID) of the OBD adapter
# Veepeak OBDCheck VP01 default: WiFi_OBDII
ssid=WiFi_OBDII

# WiFi Password / WEP Key
# Veepeak VP01 WiFi is an open network by default (leave blank)
key=

# Adapter IP address
# Veepeak VP01 WiFi default: 192.168.0.10
# (When testing in melonDS SLiRP, use 10.0.2.2)
ip=192.168.0.10

# Client / DS IP address (defaults to 192.168.0.11 on Veepeak 192.168.0.x subnet)
# ds_ip=192.168.0.11

# Adapter TCP Port
# Veepeak VP01 WiFi default: 35000
port=35000

# Vehicle Connection Profile (Car Scanner style):
# subaru, standard, toyota, vag, ford, gm, nissan, honda, hyundai, bmw, iso9141, j1850pwm, j1850vpw, generic
# Leave commented or empty to show the interactive Car Selector on boot
#profile=subaru

# Auto-poll telemetry periodically (1 = Enabled, 0 = Manual query only)
auto_poll=1

# Polling interval in milliseconds (default: 400ms)
poll_ms=400

# Gauge cluster ROM (turboxs-dtec) polling interval in milliseconds (default: 200ms)
# gauge_poll_ms=200
